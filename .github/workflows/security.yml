name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Query pinned public dependency revisions
        run: node scripts/check-dependency-advisories.mjs

  codeql:
    name: CodeQL
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned analysis toolchain
        run: scripts/verify-build-toolchain.sh
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Build analyzed target
        run: swift build -c release --product lockedin-flow --force-resolved-versions
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          output: build/codeql
      - name: Reject analysis findings or incomplete evidence
        run: node scripts/check-codeql-results.mjs build/codeql/swift.sarif

  secret-scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          version: "3.97.9"
          extra_args: --results=verified,unknown,unverified --fail-on-scan-errors
