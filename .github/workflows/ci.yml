name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned release toolchain
        run: scripts/verify-build-toolchain.sh
      - name: Resolve locked dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
      - name: Verify zero-dependency npm tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run check:public
          npm run check:public -- --history
          git diff --exit-code -- package-lock.json
      - name: Swift format lint
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift scripts/generate-sbom.swift
      - name: Debug build and type check
        run: swift build --force-resolved-versions
      - name: Release build
        run: swift build -c release --product lockedin-flow --force-resolved-versions
      - name: Release binary diagnostic gate
        run: scripts/verify-production-binary.sh "$(swift build -c release --show-bin-path)/lockedin-flow"
      - name: Unit and policy tests
        run: |
          swift test --force-resolved-versions
          scripts/test-sbom.sh
          scripts/test-production-binary-policy.sh
          scripts/test-runtime-network-policy.sh
      - name: Shell syntax
        run: |
          /bin/bash -n \
            scripts/generate-sbom.sh \
            scripts/install-app.sh \
            scripts/lib/macos-acl.sh \
            scripts/package-app.sh \
            scripts/package-evaluation-pkg.sh \
            scripts/selftest.sh \
            scripts/soak.sh \
            scripts/test-production-binary-policy.sh \
            scripts/test-runtime-network-policy.sh \
            scripts/test-sbom.sh \
            scripts/validate-sbom.sh \
            scripts/verify-build-toolchain.sh \
            scripts/verify-model-cache.sh \
            scripts/verify-production-binary.sh
      - name: Package local evaluation bundle
        run: |
          scripts/package-app.sh
          scripts/package-evaluation-pkg.sh --skip-build
      - name: Verify packaged artifact
        run: |
          test -f "build/LockedIn Flow.app/Contents/Resources/SBOM.cdx.json"
          test -f "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Eq '^model-artifacts-sha256: [0-9a-f]{64}$' "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Eq '^model-sources-sha256: [0-9a-f]{64}$' "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx 'source-state: clean' "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx "source-revision: ${GITHUB_SHA}" "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx "package-resolved-sha256: $(shasum -a 256 Package.resolved | awk '{print $1}')" "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx "sbom-sha256: $(shasum -a 256 'build/LockedIn Flow.app/Contents/Resources/SBOM.cdx.json' | awk '{print $1}')" "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx "model-artifacts-sha256: $(shasum -a 256 security/model-artifacts.tsv | awk '{print $1}')" "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          grep -Fqx "model-sources-sha256: $(shasum -a 256 security/model-sources.tsv | awk '{print $1}')" "build/LockedIn Flow.app/Contents/Resources/BUILD-PROVENANCE.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          scripts/validate-sbom.sh "build/LockedIn Flow.app/Contents/Resources/SBOM.cdx.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/LockedIn Flow.app/Contents/Info.plist')" = "ai.lockedin.flow.community"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' 'build/LockedIn Flow.app/Contents/Info.plist')" = "LockedIn Flow"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' 'build/LockedIn Flow.app/Contents/Info.plist')" = "LockedInFlow"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LockedInReleaseStage' 'build/LockedIn Flow.app/Contents/Info.plist')" = "release-candidate"
          ! find "build/LockedIn Flow.app/Contents" -iname '*Sparkle*' -print -quit | grep -q .
          ! otool -L "build/LockedIn Flow.app/Contents/MacOS/LockedInFlow" | grep -q Sparkle
          jq -e '.metadata.component.name == "LockedIn Flow" and (.metadata.component.properties | any(.name == "com.lockedinflow.app.bundle-identifier" and .value == "ai.lockedin.flow.community"))' "build/LockedIn Flow.app/Contents/Resources/SBOM.cdx.json"
          codesign --verify --deep --strict --verbose=2 "build/LockedIn Flow.app"
          test -f "build/LockedIn-Flow-evaluation-unsigned.pkg"
          pkgutil --payload-files "build/LockedIn-Flow-evaluation-unsigned.pkg" | grep -Fq 'Applications/LockedIn Flow.app/Contents/MacOS/LockedInFlow'
          ditto -c -k --keepParent --noextattr --norsrc "build/LockedIn Flow.app" "build/LockedIn-Flow-unsigned.zip"
          unzip -t "build/LockedIn-Flow-unsigned.zip"
          cp "build/LockedIn Flow.app/Contents/Resources/SBOM.cdx.json" \
            "build/LockedIn-Flow-SBOM.cdx.json"
      - name: Upload protected-main evaluation artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LockedIn-Flow-unsigned-${{ github.sha }}
          path: |
            build/LockedIn-Flow-unsigned.zip
            build/LockedIn-Flow-evaluation-unsigned.pkg
            build/LockedIn-Flow-SBOM.cdx.json
          retention-days: 7

  attest-public-evaluation:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LockedIn-Flow-unsigned-${{ github.sha }}
          path: build
      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: build/LockedIn-Flow-unsigned.zip
      - name: Attest evaluation package provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: build/LockedIn-Flow-evaluation-unsigned.pkg
      - name: Attest packaged SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: build/LockedIn-Flow-unsigned.zip
          sbom-path: build/LockedIn-Flow-SBOM.cdx.json
